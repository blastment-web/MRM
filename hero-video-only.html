<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>히어로 비디오 템플릿 (텍스트 없음, 3~8초 구간 반복)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- HTML의 loop 속성을 빼고 JavaScript로 루프를 제어합니다. URL 뒤에 #t=3,8 을 붙여 미디어 프래그먼트 적용 -->
        <video id="bg-video" class="hero-video" autoplay muted playsinline>
            <source src="https://www.lgensol.com/inc/video/video_main01.mp4#t=3,8" type="video/mp4">
            여러분의 브라우저가 동영상을 지원하지 않습니다.
        </video>

        <div class="hero-overlay"></div>
    </section>

    <!-- 3~8초 구간만 반복되도록 제어하는 자바스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById("bg-video");

            const startTime = 3.0; // 시작 초
            const endTime = 8.0;   // 종료 초

            // 메타데이터가 로드되면 시작 시간으로 이동
            video.addEventListener("loadedmetadata", function() {
                video.currentTime = startTime;
            });

            // 시간이 업데이트 될 때마다 체크하여 8초가 넘어가면 3초로 되돌림
            video.addEventListener("timeupdate", function() {
                if (video.currentTime >= endTime) {
                    video.currentTime = startTime;
                    video.play(); // 루프될 때 일시정지되는 현상 방지
                }
            });
        });
    </script>
</body>
</html>
