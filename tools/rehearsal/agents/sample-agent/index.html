<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연결 확인용 예시 Agent</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:#080b13;color:#e8ecf6;
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif}
  .box{max-width:560px;padding:40px 44px;border:1px solid #223;border-radius:16px;
       background:#0d1220;line-height:1.75}
  h1{margin:0 0 6px;font-size:26px}
  .sub{margin:0 0 22px;color:#7fd4ff;font-weight:700;letter-spacing:.02em}
  ol{margin:0;padding-left:20px;color:#aab4c8}
  li{margin:6px 0}
  code{background:#131a2c;padding:2px 6px;border-radius:5px;color:#ffd48a}
</style>
</head>
<body>
  <div class="box">
    <h1>연결에 성공했습니다</h1>
    <p class="sub">이 페이지는 MAPS 카드에서 열린 예시 Agent 입니다</p>
    <p style="margin:0 0 14px;color:#aab4c8">
      이 화면이 보인다면 <b>서버에 올린 HTML 이 카드로 연결되는 경로</b>가 확인된 것입니다.
      이제 같은 자리에 동료가 만든 진짜 HTML 을 넣으면 됩니다.
    </p>
    <ol>
      <li><code>4_에이전트연결.bat</code> 실행 → 폴더 이름과 HTML 경로 입력</li>
      <li>배치가 찍어 준 <code>"addr":"http://…"</code> 한 줄을 복사</li>
      <li>열린 <code>dashboards.json</code> 에서 해당 Agent 의 <code>"addr":""</code> 를 그 줄로 교체</li>
      <li>MAPS 화면에서 <b>Ctrl+F5</b></li>
    </ol>
  </div>
</body>
</html>
